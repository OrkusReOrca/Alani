<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Alani</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="transcript">
    <div id="transcript-spacer"></div>
    <div id="transcript-text"></div>
  </div>
  <canvas id="scene"></canvas>
  <div id="status">Starting up...</div>

  <input id="volume" type="range" min="0" max="1.5" step="0.05" value="1" title="Alani's volume" />

  <button id="settings-toggle" title="Settings">⋮</button>
  <div id="settings-panel" class="hidden">
    <label>Input
      <select id="input-device"></select>
    </label>
    <label>Output
      <select id="output-device"></select>
    </label>
    <label>Text size
      <input id="text-size" type="range" min="9" max="34" step="1" value="13" />
    </label>
  </div>

  <div id="bottom-left-controls">
    <button id="tts-btn" title="Voice replies">🔊</button>
    <button id="sleep-btn" title="Sleep mode">Z</button>
    <button id="power-btn" title="Power">⏻</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
